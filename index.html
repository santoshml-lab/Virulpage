<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎬 ViralReel AI PRO</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#020617;
color:white;
padding:20px;
}

/* HEADER */
header{
text-align:center;
padding:20px;
}

header h1{
font-size:52px;
color:#38bdf8;
}

header p{
opacity:0.7;
margin-top:8px;
}

/* CARD */
.card{
max-width:900px;
margin:30px auto;
background:rgba(255,255,255,0.05);
padding:20px;
border-radius:20px;
border:1px solid rgba(255,255,255,0.08);
backdrop-filter:blur(10px);
}

/* INPUT */
input, select{
width:100%;
padding:14px;
margin-top:12px;
border:none;
border-radius:12px;
background:#111827;
color:white;
outline:none;
}

/* BUTTON */
button{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:12px;
background:linear-gradient(45deg,#38bdf8,#9333ea);
color:white;
font-weight:700;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

/* OUTPUT */
.output{
margin-top:20px;
background:#111827;
padding:18px;
border-radius:16px;
min-height:150px;
white-space:pre-wrap;
border-left:4px solid #38bdf8;
}

/* AUDIO */
.audio-box{
text-align:center;
margin-top:10px;
}

.small{
font-size:12px;
opacity:0.7;
margin-top:5px;
}

/* ACTION ROW */
.row{
display:flex;
gap:10px;
margin-top:10px;
}

.small-btn{
flex:1;
padding:10px;
font-size:13px;
}

/* HISTORY */
.history{
margin-top:20px;
font-size:13px;
opacity:0.8;
}

@media(max-width:768px){
header h1{font-size:34px;}
.row{flex-direction:column;}
}

</style>

</head>

<body>

<header>
<h1>🎬 ViralReel AI PRO</h1>
<p>One click → Viral content engine 🚀</p>
</header>

<!-- 🎵 MUSIC -->
<div class="audio-box">

<p class="small">🎵 Click to enable background music</p>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b3d3d0c3.mp3?filename=cyberpunk-synthwave-ambient-11049.mp3" type="audio/mpeg">
</audio>

<button onclick="playMusic()">🎧 Start Music</button>

</div>

<div class="card">

<input id="topic" placeholder="Enter topic (e.g. Study Motivation)">

<select id="style">
<option>Motivational</option>
<option>Funny</option>
<option>Sigma</option>
<option>Luxury</option>
<option>Anime</option>
<option>Emotional</option>
</select>

<button onclick="generateAll()">🚀 Generate Viral Reel</button>

<div class="output" id="output">
Your AI output will appear here 🚀
</div>

<div class="row">

<button class="small-btn" onclick="copyText()">📋 Copy</button>
<button class="small-btn" onclick="saveHistory()">💾 Save</button>

</div>

<div class="history" id="history">
No saved content yet
</div>

</div>

<script>

const API = "https://virulreel.onrender.com";

/* 🎧 MUSIC FIX */
function playMusic(){
document.getElementById("bgMusic").play();
}

/* 🚀 GENERATE */
async function generateAll(){

const topic = document.getElementById("topic").value;
const style = document.getElementById("style").value;
const output = document.getElementById("output");

if(!topic){
output.innerHTML = "❌ Enter topic first";
return;
}

output.innerHTML = "⚡ AI is creating viral reel...";

try{

let res = await fetch(API+"/generate-all",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
topic: topic + " in " + style + " style"
})
});

let data = await res.json();

output.innerHTML = marked.parse(data.result || "No response");

}
catch(err){
output.innerHTML = "❌ Error generating content";
console.log(err);
}

}

/* COPY */
function copyText(){
let text = document.getElementById("output").innerText;
navigator.clipboard.writeText(text);
alert("Copied 🚀");
}

/* SAVE */
function saveHistory(){
let text = document.getElementById("output").innerText;
localStorage.setItem("viral_history", text);
document.getElementById("history").innerText = "✅ Saved!";
}

/* LOAD */
window.onload = function(){
let data = localStorage.getItem("viral_history");
if(data){
document.getElementById("history").innerText = data;
}
}

</script>

</body>
</html>
